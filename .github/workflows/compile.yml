name: Compile index

# Rebuild data/index.json whenever a listing changes (after a PR merges to main, or any push).
on:
  push:
    branches: [main]
    paths:
      - 'data/*.json'
      - 'scripts/compile-index.php'
      - 'taxonomy.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      # Check out with the bot's write DEPLOY KEY: main requires passing checks, and the "Required checks" ruleset
      # lets only a deploy key bypass that (a user-owned repo can't exempt the Actions app). The GITHUB_TOKEN push
      # below would be rejected.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.VENDOR_BOT_DEPLOY_KEY }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Compile index.json
        run: php scripts/compile-index.php
      - name: Commit if changed
        run: |
          if ! git diff --quiet data/index.json; then
            git config user.name  "tiger-vendor-bot"
            git config user.email "bot@webtigers.com"
            git add data/index.json
            git commit -m "chore: recompile index.json"
            git push
          else
            echo "index.json already up to date."
          fi
